name: erp
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - '8221:8000'
    environment:
      APP_TIMEZONE: UTC
      TZ: UTC
    networks:
      - erp-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["start-backend", "scheduler"]
    volumes:
      - .:/var/www/html
    environment:
      APP_TIMEZONE: UTC
      TZ: UTC
    networks:
      - erp-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["start-backend", "queue"]
    volumes:
      - .:/var/www/html
    environment:
      APP_TIMEZONE: UTC
      TZ: UTC
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      QUEUE_WORK_CONNECTION: ${QUEUE_WORK_CONNECTION:-database}
      DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-130}
      QUEUE_NAMES: ${QUEUE_NAMES:-default}
      QUEUE_SLEEP: ${QUEUE_SLEEP:-3}
      QUEUE_TRIES: ${QUEUE_TRIES:-3}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-120}
      QUEUE_MAX_TIME: ${QUEUE_MAX_TIME:-3600}
      QUEUE_MEMORY: ${QUEUE_MEMORY:-512}
    networks:
      - erp-network

  queue_import:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_queue_import
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["start-backend", "queue"]
    volumes:
      - .:/var/www/html
    environment:
      APP_TIMEZONE: UTC
      TZ: UTC
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      QUEUE_WORK_CONNECTION: ${IMPORT_QUEUE_CONNECTION:-database_import}
      IMPORT_QUEUE: ${IMPORT_QUEUE:-import}
      IMPORT_QUEUE_RETRY_AFTER: ${IMPORT_QUEUE_RETRY_AFTER:-1860}
      QUEUE_NAMES: ${IMPORT_QUEUE:-import}
      QUEUE_SLEEP: ${IMPORT_QUEUE_SLEEP:-3}
      QUEUE_TRIES: ${IMPORT_QUEUE_TRIES:-3}
      QUEUE_TIMEOUT: ${IMPORT_QUEUE_TIMEOUT:-1830}
      QUEUE_MAX_TIME: ${IMPORT_QUEUE_MAX_TIME:-3600}
      QUEUE_MEMORY: ${IMPORT_QUEUE_MEMORY:-1024}
    networks:
      - erp-network

  queue_payroll_recalculation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_queue_payroll_recalculation
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["start-backend", "queue"]
    volumes:
      - .:/var/www/html
    environment:
      APP_TIMEZONE: UTC
      TZ: UTC
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      QUEUE_WORK_CONNECTION: ${PAYROLL_RECALCULATION_QUEUE_CONNECTION:-database_payroll_recalculation}
      PAYROLL_RECALCULATION_QUEUE: ${PAYROLL_RECALCULATION_QUEUE:-payroll_recalculation}
      PAYROLL_RECALCULATION_QUEUE_RETRY_AFTER: ${PAYROLL_RECALCULATION_QUEUE_RETRY_AFTER:-390}
      QUEUE_NAMES: ${PAYROLL_RECALCULATION_QUEUE:-payroll_recalculation}
      QUEUE_SLEEP: ${PAYROLL_RECALCULATION_QUEUE_SLEEP:-3}
      QUEUE_TRIES: ${PAYROLL_RECALCULATION_QUEUE_TRIES:-1}
      QUEUE_TIMEOUT: ${PAYROLL_RECALCULATION_QUEUE_TIMEOUT:-330}
      QUEUE_MAX_TIME: ${PAYROLL_RECALCULATION_QUEUE_MAX_TIME:-3600}
      QUEUE_MEMORY: ${PAYROLL_RECALCULATION_QUEUE_MEMORY:-512}
    networks:
      - erp-network

networks:
  erp-network:
    external: true
    name: erp_erp-network
