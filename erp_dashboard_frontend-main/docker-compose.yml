name: erp
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp_frontend
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '4000:4000'
    networks:
      - erp-network

networks:
  erp-network:
    external: true
    name: erp_erp-network

volumes:
  frontend_node_modules:
